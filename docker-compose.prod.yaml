version: "3"

services:
  api:
    build:
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - mysql
    volumes:
      - ./docker/api/php/config/docker-opcache.ini:/usr/local/etc/php/conf.d/docker-opcache.ini
      - ./docker/api/php/config/docker-timezone.ini:/usr/local/etc/php/conf.d/docker-timezone.ini
    networks:
      default:
        ipv4_address: ${API_IPV4}

  frontend:
    build:
      dockerfile: ../docker/frontend/Dockerfile.prod
    command: serve -s dist -l 3000
    restart: always

  nginx:
    build:
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes:
      - ./docker/certs/prod:/etc/nginx/certs
    ports:
      - 80:80
      - 443:443
    environment:
      NGINX_HOST: ${NGINX_HOST_PROD}
      NGINX_PORT: ${NGINX_PORT_PROD}
      NGINX_CERT_CRT: ${NGINX_CERT_CRT_PROD}
      NGINX_CERT_KEY: ${NGINX_CERT_KEY_PROD}
    networks:
      default:
        ipv4_address: ${NGINX_IPV4}

  mysql:
    image: mysql:8.0
    container_name: ${PROJECT_NAME}-mysql
    restart: unless-stopped
    volumes:
      - mysql:/var/lib/mysql
    ports:
      - 13306:3306
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      default:
        ipv4_address: ${MYSQL_IPV4}

  backup:
    image: databack/mysql-backup:1.2.2
    container_name: ${PROJECT_NAME}-mysql-backup
    restart: unless-stopped
    depends_on:
      - mysql
    command: [ "dump" ]
    environment:
      DB_SERVER: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      DB_NAMES: ${MYSQL_DATABASE}
      DB_DUMP_FREQUENCY: 1440           # щоденний дамп
      DB_DUMP_BEGIN: "0100"             # перший запуск о 01:00
      DB_DUMP_TARGET: /db
      DB_DUMP_RETENTION: 2c             # локально тримаємо 2 останні дампи
    volumes:
      - ./docker/backup:/db
    networks:
      - default

  rclone:
    image: rclone/rclone:latest
    container_name: ${PROJECT_NAME}-rclone
    restart: unless-stopped
    depends_on:
      - backup
    environment:
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - ./docker/backup:/db              # спільний том з дампами
      - ./docker/rclone:/config/rclone
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          rclone copy /db Dropbox:${PROJECT_NAME}_mysqldump/ \
            --config /config/rclone/rclone.conf \
            --exclude .gitkeep \
            --verbose
          sleep 3600
        done
    networks:
      - default


volumes:
  mysql:
